site_name: "Kunal Patil | Enterprise Architecture & GenAI"
site_description: "Executive Career Portfolio - Architecture, Cloud Transformation, GenAI Solutions"
site_author: "Kunal Patil"
site_url: "https://patilkunals.github.io/"

# Build settings
docs_dir: website
site_dir: site
build_dir: build

# Navigation
nav:
  - Home: index.md
  - About: about.md
  - Portfolio: portfolio.md
  - Architecture Philosophy: architecture.md

# Theme configuration
theme:
  name: material
  custom_dir: overrides
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.integrate
    - content.code.copy
    - content.tabs.link

# Plugin configuration
plugins:
  - search
  - minify:
      minify_html: true
      minify_css: true
      minify_js: true

# Extensions
markdown_extensions:
  - pymdownx.arithmatex
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - admonition
  - toc:
      permalink: "🔗"
  - meta
  - tables

# Extra settings
extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/patilkunal
    - icon: fontawesome/brands/github
      link: https://github.com/patilkunals
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_ID

# Copyright
copyright: "© 2026 Kunal Patil. All rights reserved."

# Repository
repo_url: https://github.com/patilkunals/patilkunals.github.io
repo_name: patilkunals/patilkunals.github.io
edit_uri: edit/main/website/

